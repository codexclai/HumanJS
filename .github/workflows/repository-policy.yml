name: Repository policy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-main
  cancel-in-progress: true

jobs:
  policy:
    name: policy-and-rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check Python experiment runner syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          scripts = sorted(Path("experiments").glob("*.py"))
          for script in scripts:
              ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          print(f"Parsed {len(scripts)} Python experiment scripts")
          PY
      - name: Test Wilbers voltage-sampling counterfactuals
        run: |
          python3 -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.11.4
          python3 -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Validate Wilbers Figure S5 digitization
        run: python3 experiments/validate_wilbers_fig_s5_digitization.py
      - name: Validate Wilbers current-clamp conductance grid
        run: python3 experiments/validate_wilbers_current_clamp_grid.py
      - name: Validate Wilbers sodium IV tau summary
        run: python3 experiments/validate_wilbers_na_iv_tau_summary.py
      - name: Replay Wilbers sodium IV composite-current fits
        run: python3 experiments/replay_wilbers_na_iv_current_fit.py
      - name: Validate Wilbers sodium IV current-fit replay
        run: python3 experiments/validate_wilbers_na_iv_current_fit_replay.py
      - name: Install pinned NEURON source-replay dependencies
        run: python3 -m pip install --disable-pip-version-check -r experiments/requirements-wilbers-neuron.txt
      - name: Replay original Wilbers Na_IV and auxiliary gates using NEURON VClamp
        run: |
          python3 experiments/replay_wilbers_na_iv_neuron.py \
            --output /tmp/wilbers-na-iv-neuron.csv \
            --inactivation-output /tmp/wilbers-na-iv-inact-neuron.csv \
            --recovery-output /tmp/wilbers-na-recovery-neuron.csv \
            --emit-aux-to-stdout
      - name: Validate original NEURON Na_IV replay
        run: python3 experiments/validate_wilbers_na_iv_neuron_replay.py --actual /tmp/wilbers-na-iv-neuron.csv
      - name: Validate original NEURON Na inactivation and recovery replays
        run: |
          python3 experiments/validate_wilbers_na_iv_auxiliary_neuron_replay.py \
            --inactivation-actual /tmp/wilbers-na-iv-inact-neuron.csv \
            --recovery-actual /tmp/wilbers-na-recovery-neuron.csv
      - name: Replay original Wilbers K_IV and K_recovery using NEURON VClamp
        run: |
          python3 experiments/replay_wilbers_k_iv_neuron.py \
            --iv-output /tmp/wilbers-k-iv-neuron.csv \
            --recovery-output /tmp/wilbers-k-recovery-neuron.csv \
            --fit-diagnostic-output /tmp/wilbers-k-iv-fit-diagnostics.csv \
            --fit-profile-output /tmp/wilbers-k-iv-fit-profile.csv \
            --fit-extended-profile-output /tmp/wilbers-k-iv-fit-profile-extended.csv \
            --fit-local-profile-output /tmp/wilbers-k-iv-fit-profile-local.csv \
            --fit-profile-residual-output /tmp/wilbers-k-iv-fit-profile-residuals.csv \
            --emit-to-stdout
      - name: Validate original NEURON K_IV and K_recovery replays
        run: |
          python3 experiments/validate_wilbers_k_iv_neuron_replay.py \
            --iv-actual /tmp/wilbers-k-iv-neuron.csv \
            --recovery-actual /tmp/wilbers-k-recovery-neuron.csv
      - name: Validate K_IV same-waveform fit-start diagnostics
        run: |
          python3 experiments/validate_wilbers_k_iv_fit_diagnostics.py \
            --actual /tmp/wilbers-k-iv-fit-diagnostics.csv \
            --source-iv /tmp/wilbers-k-iv-neuron.csv
      - name: Validate K_IV profiled fast-tau objective
        run: |
          python3 experiments/validate_wilbers_k_iv_fit_profile.py \
            --actual /tmp/wilbers-k-iv-fit-profile.csv
      - name: Validate extended-bound K_IV profiled fast-tau objective
        run: |
          python3 experiments/validate_wilbers_k_iv_fit_profile.py \
            --actual /tmp/wilbers-k-iv-fit-profile-extended.csv \
            --upper-bound-ms 1200 \
            --expected-grid-size 901
      - name: Validate high-resolution local K_IV tau profile
        run: |
          python3 experiments/validate_wilbers_k_iv_fit_profile.py \
            --actual /tmp/wilbers-k-iv-fit-profile-local.csv \
            --lower-bound-ms 320 \
            --upper-bound-ms 360 \
            --expected-grid-size 801
      - name: Validate time-resolved K_IV profile residuals
        run: |
          python3 experiments/validate_wilbers_k_iv_fit_residuals.py \
            --actual /tmp/wilbers-k-iv-fit-profile-residuals.csv \
            --profile /tmp/wilbers-k-iv-fit-profile-local.csv
      - name: Validate repository policy
        run: python3 .github/scripts/repository_policy.py
