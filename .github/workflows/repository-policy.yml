name: Repository policy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-main
  cancel-in-progress: true

jobs:
  policy:
    name: policy-and-rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check Python experiment runner syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          scripts = sorted(Path("experiments").glob("*.py"))
          for script in scripts:
              ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          print(f"Parsed {len(scripts)} Python experiment scripts")
          PY
      - name: Test Wilbers voltage-sampling counterfactuals
        run: |
          python3 -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.11.4
          python3 -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Validate Wilbers Figure S5 digitization
        run: python3 experiments/validate_wilbers_fig_s5_digitization.py
      - name: Validate Wilbers current-clamp conductance grid
        run: python3 experiments/validate_wilbers_current_clamp_grid.py
      - name: Validate Wilbers sodium IV tau summary
        run: python3 experiments/validate_wilbers_na_iv_tau_summary.py
      - name: Replay Wilbers sodium IV composite-current fits
        run: python3 experiments/replay_wilbers_na_iv_current_fit.py
      - name: Validate repository policy
        run: python3 .github/scripts/repository_policy.py
