name: Repository policy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-main
  cancel-in-progress: true

jobs:
  policy:
    name: policy-and-rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check Python experiment runner syntax
        run: |
          python3 -c "import ast; from pathlib import Path; ast.parse(Path('experiments/reproduce_eyal_figure7a.py').read_text(encoding='utf-8'))"
      - name: Validate repository policy
        run: python3 .github/scripts/repository_policy.py
